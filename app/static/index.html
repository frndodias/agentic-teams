<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic Data Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="marca">
      <svg class="nuvem" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0059D5"/>
        <path d="M10.5 21.5h11a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 11.6 12.6a4.5 4.5 0 0 0-1.1 8.9z" fill="#fff"/></svg>
      <div class="titulo rotulo">Agentic Data Team<small>Nuvemshop</small></div>
    </div>
    <nav>
      <button data-aba="conversa" class="ativa" title="Conversa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14.5h4"/></svg><span class="rotulo">Conversa</span></button>
      <button data-aba="time" title="Time ao vivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/><path d="M2.5 13v2M21.5 13v2"/></svg><span class="rotulo">Time ao vivo</span><span id="dot-time" class="dot oculto"></span></button>
      <button data-aba="revisao" title="Revisão"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/><path d="M13 5l-2 2 2 2"/></svg><span class="rotulo">Revisão</span><span id="badge-revisao" class="badge oculto">0</span></button>
      <button data-aba="operacao" title="Operação"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="rotulo">Operação</span></button>
    </nav>
    <div class="slogan rotulo">from data consumer<br>to data creator</div>
    <div id="usuario" class="usuario"></div>
    <button id="recolher" class="recolher" title="Recolher menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="rotulo">Recolher</span></button>
  </aside>

  <main id="conteudo">
    <!-- CONVERSA -->
    <section id="aba-conversa" class="aba ativa">
      <div class="chat" id="chat"></div>
      <div class="sugestoes" id="sugestoes"></div>
      <form id="form-pergunta" class="entrada">
        <input id="pergunta" autocomplete="off" placeholder="Pergunte sobre vendas, lojistas, pagamentos, clientes…" />
        <button type="submit">Perguntar</button>
      </form>
    </section>

    <!-- TIME AO VIVO -->
    <section id="aba-time" class="aba">
      <div class="barra">
        <select id="sel-run"></select>
        <div id="kpis-run" class="kpis"></div>
      </div>
      <div class="time-grid">
        <div>
          <div id="diagrama" class="diagrama"></div>
          <div id="acao-humana"></div>
          <div class="cartao"><h3>Plano do Supervisor</h3><div id="plano" class="md"></div></div>
          <div class="cartao"><h3>Testes do Quality Agent</h3><table id="tab-dq" class="tabela"></table></div>
        </div>
        <div class="cartao timeline-wrap"><h3>Linha do tempo</h3><ol id="timeline" class="timeline"></ol></div>
      </div>
    </section>

    <!-- REVISÃO -->
    <section id="aba-revisao" class="aba">
      <div class="rev-grid">
        <aside class="cartao"><h3>Pull requests</h3><ul id="lista-revisao" class="lista"></ul></aside>
        <div id="rev-detalhe" class="rev-detalhe"><div class="vazio">Selecione um PR para revisar.</div></div>
      </div>
    </section>

    <!-- OPERAÇÃO -->
    <section id="aba-operacao" class="aba">
      <div id="op-kpis" class="kpis grandes"></div>
      <div class="op-grid">
        <div class="cartao"><h3>Por agente</h3><table id="op-agentes" class="tabela"></table></div>
        <div class="cartao"><h3>Decisões humanas</h3><table id="op-aprov" class="tabela"></table>
          <h3>Testes de qualidade</h3><table id="op-dq" class="tabela"></table></div>
      </div>
      <div class="cartao"><h3>Execuções</h3><table id="op-runs" class="tabela"></table></div>
      <div id="op-links" class="links"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
